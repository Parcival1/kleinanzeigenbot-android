# Alles, was die App ausmacht, an einer Stelle.
# APPLICATION_ID nie ändern – sonst installiert Android eine zweite App statt eines Updates.
APP_NAME=KleinanzeigenBot
APPLICATION_ID=de.kleinanzeigenbot.app
# Je Release um 0.1 erhöhen; der Tag heißt dann v<VERSION>.
VERSION=1.2
# Fester Server: die App spricht nur mit ihm (Weboberfläche und Updates), änderbar nur per neuer Version.
SERVER=https://kleinanzeigenbot.lel-tech.de
