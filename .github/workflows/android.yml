name: Android

# Gebaut wird nur hier. Ein Tag v* erzeugt ein Release als Entwurf; sichtbar
# (und damit als Update angeboten) wird es erst, wenn alle Tests grün sind.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 des Signierzertifikats. Eine APK mit anderem Schlüssel installiert
  # Android nicht als Update – darum bricht der Bau dann ab.
  ZERTIFIKAT_SHA256: "8fed7612d5a79df0df5937db52120b67717e65212fdbf398453d7a0921f338d5"

jobs:
  bauen:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Version bestimmen
        id: version
        run: |
          MARKE="$(sed -n 's/^VERSION=//p' marke.properties | tr -d '[:space:]')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            [ "$V" = "$MARKE" ] || { echo "::error::Tag $GITHUB_REF_NAME passt nicht zu VERSION=$MARKE"; exit 1; }
          else
            V="$MARKE"
          fi
          [ "$(jq -r '.[0].version' app/src/main/assets/neuigkeiten.json)" = "$V" ] \
            || { echo "::error::neuigkeiten.json hat oben keinen Eintrag für $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Unit-Tests
        run: gradle --no-daemon -PappVersion=${{ steps.version.outputs.version }} testReleaseUnitTest

      - name: Signierschlüssel bereitstellen
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Secret KEYSTORE_BASE64 fehlt"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kleinanzeigenbot.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/kleinanzeigenbot.p12" >> "$GITHUB_ENV"

      - name: Bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          V="${{ steps.version.outputs.version }}"
          # Erst der Testbau gegen den Rauchtest-Server (einziger Unterschied: SERVER), dann der echte.
          if [ "${{ github.event_name }}" != pull_request ]; then
            gradle --no-daemon -PappVersion=$V -PserverAdresse=http://10.0.2.2:8106 assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/rauchtest-app.apk"
            gradle --no-daemon clean
          fi
          gradle --no-daemon -PappVersion=$V assembleRelease

      - name: APK umbenennen und Signatur prüfen
        run: |
          V="${{ steps.version.outputs.version }}"
          rm -f "$RUNNER_TEMP/kleinanzeigenbot.p12"
          if [ "${{ github.event_name }}" = pull_request ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "kleinanzeigenbot-$V.apk"
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk "kleinanzeigenbot-$V.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "kleinanzeigenbot-$V.apk" | tee zertifikat.txt
          IST="$(sed -n 's/.*certificate SHA-256 digest: //p' zertifikat.txt | head -1)"
          [ "$IST" = "$ZERTIFIKAT_SHA256" ] || { echo "::error::Falscher Signierschlüssel ($IST)"; exit 1; }
          sha256sum "kleinanzeigenbot-$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kleinanzeigenbot-apk
          path: kleinanzeigenbot-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: rauchtest-apk
          path: ${{ runner.temp }}/rauchtest-app.apk
          if-no-files-found: error

      - name: Release als Entwurf anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          jq -r '.[0].punkte[] | "- " + .' app/src/main/assets/neuigkeiten.json > notizen.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "kleinanzeigenbot-$V.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "kleinanzeigenbot-$V.apk" --draft --prerelease \
              --title "KleinanzeigenBot $V" --notes-file notizen.md
          fi

  rauchtest:
    needs: bauen
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rauchtest-apk

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rauchtest im Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated
          script: bash .github/rauchtest/rauchtest.sh rauchtest-app.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rauchtest-bilder
          path: rauchtest-*.png
          if-no-files-found: ignore

  veroeffentlichen:
    needs: [bauen, rauchtest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kleinanzeigenbot-apk

      - name: Hochgeladene Datei prüfen und Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="${{ needs.bauen.outputs.version }}"
          gh release download "$GITHUB_REF_NAME" -p "kleinanzeigenbot-$V.apk" -D pruefung
          cmp "kleinanzeigenbot-$V.apk" "pruefung/kleinanzeigenbot-$V.apk"
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
